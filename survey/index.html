<title>로고 디자인 사전 설문</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Archivo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: one narrow reading column; reference logos sit on dark "screen" panels like an opening card */
:root{
  --paper:#f3f2ee; --surface:#ffffff; --ink:#1a1a1a; --muted:#6b6a66;
  --line:#d9d7d0; --accent:#8f2a2b; --accent-soft:#f3e4e2; --chip:#e9e7e1;
  --screen:#121214; --screen-2:#1c1c20; --screen-ink:#cfcdc6; --screen-dim:#86847e;
  --display:"Gowun Batang",Georgia,serif;
  --body:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --latin:"Archivo","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1b1c1e; --surface:#26272a; --ink:#ecebe7; --muted:#a3a19b;
    --line:#3a3b3f; --accent:#e07a76; --accent-soft:#3a2626; --chip:#303135;
    --screen:#0c0c0e; --screen-2:#161619; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1b1c1e; --surface:#26272a; --ink:#ecebe7; --muted:#a3a19b;
  --line:#3a3b3f; --accent:#e07a76; --accent-soft:#3a2626; --chip:#303135;
  --screen:#0c0c0e; --screen-2:#161619; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);
  font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
.slate{height:26px;background:repeating-linear-gradient(-45deg,var(--ink) 0 16px,var(--paper) 16px 32px)}
.wrap{max-width:760px;margin:0 auto;padding-inline:20px;padding-block:40px 80px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,7vw,42px);line-height:1.2;margin:0 0 16px;letter-spacing:-.01em;text-wrap:balance}
.lede{color:var(--muted);margin:0 0 8px;max-width:34em}
.small{font-size:14px;color:var(--muted)}
.sec{margin-top:56px;padding-top:24px;border-top:1px solid var(--line)}
.sec h2{font-family:var(--display);font-size:24px;margin:0 0 6px;display:flex;gap:12px;align-items:baseline;text-wrap:balance}
.sec h2 .n{font-family:var(--latin);font-weight:400;font-size:15px;color:var(--accent)}
.sec .intro{color:var(--muted);margin:0 0 8px;max-width:38em}
.q{display:block;margin-top:32px}
.ql{display:block;font-weight:600;margin:0 0 4px}
.hint{display:block;font-size:14px;color:var(--muted);margin-bottom:8px}
input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);
  border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-top:6px}
textarea{min-height:88px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{font:inherit;font-size:15px;color:var(--ink);background:var(--chip);border:1px solid transparent;
  border-radius:999px;padding:8px 14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* pick cards: each option is a reel of real logos */
.picks{display:grid;grid-template-columns:1fr;gap:14px;margin-top:12px}
@media (min-width:600px){.picks{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:640px){.picks.three{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pick{font:inherit;color:var(--ink);background:none;border:0;padding:0;cursor:pointer;text-align:left;min-width:0}
.reel{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px;background:var(--line);
  border-radius:8px;overflow:hidden;border:1px solid var(--line);transition:box-shadow .15s ease}
.shot{display:block;aspect-ratio:3/2;max-width:100%;background:var(--screen);overflow:hidden}
.shot img{display:block;width:100%;height:100%;object-fit:cover}
.pick .cap{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;margin-top:8px;font-weight:600;font-size:15px}
.pick .cap small{font-weight:400;color:var(--muted);font-size:13px}
.pick[aria-pressed="true"] .reel{box-shadow:0 0 0 3px var(--accent)}
.pick[aria-pressed="true"] .cap{color:var(--accent)}
.pick:hover .reel{box-shadow:0 0 0 2px var(--line)}
.pick[aria-pressed="true"]:hover .reel{box-shadow:0 0 0 3px var(--accent)}
.note{margin-top:10px}
.limit{font-size:14px;color:var(--accent);min-height:1.4em;margin-top:6px}

/* gallery */
.cat{margin-top:28px}
.cat h3{font-size:15px;font-weight:600;margin:0;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.cat h3 small{font-weight:400;color:var(--muted);font-size:13px}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:10px}
.tile{position:relative;font:inherit;cursor:pointer;border:0;padding:0;border-radius:6px;overflow:hidden;
  background:var(--screen);text-align:center;min-width:0}
.tile::after{content:"";position:absolute;inset:0;border-radius:6px;pointer-events:none;transition:box-shadow .15s ease}
.tile[aria-pressed="true"]::after{box-shadow:inset 0 0 0 3px var(--accent)}
.tile .mark{position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:50%;
  border:1.5px solid #fff;background:rgba(0,0,0,.35);display:grid;place-items:center;font-size:12px;line-height:1;color:transparent}
.tile[aria-pressed="true"] .mark{background:var(--accent);border-color:var(--accent);color:#fff}
.tally{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));margin-top:20px;display:flex;justify-content:center;pointer-events:none}
.tally span{pointer-events:auto;background:var(--ink);color:var(--paper);font-size:14px;padding:8px 16px;border-radius:999px;font-weight:500}

/* colors */
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(116px,1fr));gap:8px;margin-top:12px}
.sw{font:inherit;cursor:pointer;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;
  padding:0;overflow:hidden;text-align:left;min-width:0}
.sw i{display:block;height:46px}
.sw b{display:block;font-weight:600;font-size:13.5px;padding:7px 10px 0}
.sw small{display:block;font-family:var(--latin);font-size:11.5px;color:var(--muted);padding:0 10px 8px;font-variant-numeric:tabular-nums}
.sw[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.sw .ord{float:right;margin:7px 8px 0 0;font-size:11px;font-weight:700;color:var(--accent)}
.custom{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:12px}
.custom input[type=color]{width:46px;height:38px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:2px;cursor:pointer}
.custom input[type=text]{width:120px;margin:0;font-family:var(--latin);font-variant-numeric:tabular-nums}
.preview{display:grid;grid-template-columns:1fr;gap:1px;margin-top:16px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
@media (min-width:600px){.preview{grid-template-columns:1fr 1fr}}
.pv{padding:28px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:140px;min-width:0}
.pv.dark{background:var(--screen)} .pv.light{background:#f7f6f2}
.pv .nm{font-family:var(--latin);font-weight:800;font-size:clamp(22px,5vw,30px);letter-spacing:.04em;line-height:1.1;text-align:center;overflow-wrap:anywhere}
.pv .rule{width:56px;height:3px;border-radius:2px}

.end{margin-top:64px;padding:28px 24px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.end h2{font-family:var(--display);font-size:22px;margin:0 0 6px}
.btn{font:inherit;font-weight:600;font-size:16px;background:var(--ink);color:var(--paper);border:0;
  border-radius:8px;padding:14px 20px;margin-top:14px;cursor:pointer;width:100%}
#status{margin:12px 0 0;font-size:15px}
#out{font-size:14px;min-height:200px;margin-top:12px}
.credit{margin-top:40px;font-size:12.5px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="slate" aria-hidden="true"></div>
<main class="wrap">
  <h1>로고 디자인<br>사전 설문</h1>
  <p class="lede">좋아하시는 것과 피하고 싶은 것을 알려주시면 첫 시안부터 방향이 훨씬 가까워져요. 10분 정도 걸리고, 모르는 항목은 비워두셔도 괜찮아요.</p>
  <p class="small">예시 로고는 여러 디자이너의 작업을 스타일별로 모은 참고 자료예요. 작성 중인 내용은 이 기기에 자동 저장돼요.</p>
  <div id="form"></div>
  <section class="end">
    <h2>다 작성하셨나요?</h2>
    <p class="small" style="margin:0">버튼을 누르면 답변이 정리되어 복사돼요. 카카오톡이나 메일로 붙여넣어 보내주세요.</p>
    <button class="btn" id="copy" type="button">답변 정리해서 복사하기</button>
    <p id="status" role="status"></p>
    <textarea id="out" readonly aria-label="정리된 답변" hidden></textarea>
  </section>
  <p class="credit">예시 로고는 Pinterest와 Behance에 공개된 각 디자이너·브랜드의 작업이며, 취향을 확인하기 위한 참고 자료로만 보여드려요.</p>
</main>

      {k:"심볼 + 글자", d:"그림과 이름", l:["clae","perimeter-watch","voze","kuschall"]},
      {k:"레터마크·모노그램", d:"이니셜", l:["r-arrow","st-mono","hit-miss","k-mark"]},
      {k:"심볼 단독", d:"도형 하나", l:["sb-shape","wave","chevron","bow-mark"]},
      {k:"엠블럼·뱃지", d:"틀 안에 담은", l:["outside","actnova","found-tapes","bienoti-badge"]}]},
    {id:"type", type:"pick", label:"글자 느낌", options:[
      {k:"산세리프", d:"깔끔한 글자", l:["nifty","nano","eruditt","bienoti"]},
      {k:"세리프", d:"부리가 있는 글자", l:["princesa","bloom","blanc","partners"]},
      {k:"손글씨·개성", d:"직접 그린 듯한 글자", l:["beirut","castell","jam","rehlat"]}]},
    {id:"weight", type:"pick", label:"선의 무게", options:[
      {k:"굵고 단단하게", l:["gro","esmetal","zero","actnova"]},
      {k:"가늘고 섬세하게", l:["b-line","m-line","octan-topo","octan-rings"]}]},
    {id:"detail", type:"pick", label:"개성", options:[
      {k:"단순하게", d:"오래 써도 질리지 않게", l:["p-mark","k-mark","n-block","nano"]},
      {k:"실험적으로", d:"한눈에 튀게", l:["on-and-on","kiosk","octan-grid","tokyo"]}]},
    {id:"color", type:"pick", label:"색 쓰는 방식", options:[
      {k:"흑백", d:"색 없이", l:["st-mono","eruditt","bloom","eight-line"]},
      {k:"강한 단색", d:"한 가지 색을 상징처럼", l:["nifty","esmetal","chevron","festival-musica"]},
      {k:"그라데이션", d:"여러 색이 흐르는", l:["katana","stratus","lumen","qerra"]}]},
    {id:"point", type:"colors", max:2, label:"포인트 컬러를 골라주세요", hint:"최대 2개까지. 첫 번째는 메인, 두 번째는 보조 색으로 볼게요."}
  ]},
  {title:"어디에 쓰이나요", intro:"작게 찍히는 곳이 많을수록 단순하고 잘 읽히는 형태가 필요해요.", items:[
    {id:"usage", type:"multi", label:"로고가 쓰일 곳", options:["간판·매장","웹사이트","앱 아이콘","SNS 프로필","명함·서류","제품·패키지","유니폼·굿즈","인쇄 광고·전단","영상"]},
    {id:"motion", type:"single", label:"영상용 움직이는 로고도 필요하신가요?", options:["네, 필요해요","나중에 필요할 수도 있어요","아니요"]},
    {id:"deliver", type:"multi", label:"받고 싶은 결과물", hint:"모르시면 비워두세요. 기본 구성으로 제안드릴게요.", options:["원본 파일 (AI·SVG·PNG)","가로형·세로형 조합","국문·영문 조합","심볼 단독 버전","흑백·반전 버전","간단한 사용 가이드","명함·서식 적용","SNS 프로필 이미지"]},
    {id:"trademark", type:"single", label:"상표 등록을 하실 계획인가요?", hint:"등록하실 예정이면 비슷한 상표가 있는지 미리 살펴보며 작업해요", options:["네, 할 거예요","고민 중이에요","아니요"]}
  ]},
  {title:"마지막으로", items:[
    {id:"avoid_tags", type:"multi", label:"피하고 싶은 것", options:["업종에서 너무 흔한 아이콘","유행을 많이 타는 느낌","너무 화려한 장식","가볍거나 장난스러운 느낌","너무 차갑고 딱딱한 느낌","경쟁 브랜드와 비슷해 보이는 것"]},
    {id:"avoid", type:"textarea", label:"그 밖에 피하고 싶은 느낌이나 색"},
    {id:"refs", type:"textarea", label:"그 밖에 참고하고 싶은 로고나 이미지 링크", hint:"인스타그램, 핀터레스트, 비핸스 링크 모두 좋아요"},
    {id:"decider", type:"text", label:"시안을 보고 최종 결정하실 분", hint:"여러 분이 함께 보시면 모두 적어주세요", ph:"예: 대표님, 공동대표 1명"},
    {id:"deadline", type:"text", label:"희망하시는 완료 시점", hint:"오픈일이나 출시일처럼 꼭 맞춰야 하는 날짜가 있다면 함께 적어주세요", ph:"예: 12월 초, 매장 오픈 2주 전"}
  ]}
];

const KEY = "logo-survey-v2";
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch(e) { state = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {} };
const el = (tag, attrs={}, html="") => { const n=document.createElement(tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (html) n.innerHTML=html; return n; };
const HEX = /^#[0-9a-f]{6}$/i;
const colorName = (h) => (COLORS.find(c=>c.h.toLowerCase()===h.toLowerCase())||{n:"직접 고른 색"}).n;

function chipGroup(item, opts, multi, onLimit){
  const wrap = el("div",{class:"chips"});
  const cur = () => multi ? (state[item.id] || []) : state[item.id];
  opts.forEach(o => {
    const b = el("button",{type:"button",class:"chip"}); b.textContent=o;
    const sync = () => b.setAttribute("aria-pressed", multi ? cur().includes(o) : cur()===o);
    b.addEventListener("click", () => {
      if (multi){
        let v = [...cur()];
        if (v.includes(o)) v = v.filter(x=>x!==o);
        else { if (item.max && v.length>=item.max){ onLimit && onLimit(); return; } v.push(o); }
        state[item.id]=v;
      } else state[item.id] = cur()===o ? "" : o;
      save(); wrap.querySelectorAll(".chip").forEach(c=>c._sync());
    });
    b._sync=sync; sync(); wrap.appendChild(b);
  });
  return wrap;
}

const limitMsg = (msg, text) => { msg.textContent = text; clearTimeout(msg._t); msg._t = setTimeout(()=>msg.textContent="", 2600); };
const previews = [];

function galleryItem(item){
  if (!Array.isArray(state[item.id])) state[item.id] = [];
  const box = el("div",{class:"q",role:"group","aria-label":item.label});
  const tally = el("div",{class:"tally","aria-live":"polite"},"<span></span>");
  const syncTally = () => { const n = state[item.id].length; tally.firstChild.textContent = `${n}개 골랐어요`; tally.hidden = n===0; };
  GALLERY.forEach(cat => {
    const c = el("div",{class:"cat"});
    c.appendChild(el("h3",{},`${cat.t}<small>${cat.d}</small>`));
    const wall = el("div",{class:"wall"});
    cat.k.forEach(k => {
      const t = el("button",{type:"button",class:"tile","aria-label":LOGOS[k]},
        `<span class="shot">${img(k)}</span><span class="mark" aria-hidden="true">✓</span>`);
      const sync = () => t.setAttribute("aria-pressed", state[item.id].includes(k));
      t.addEventListener("click", () => {
        const v = state[item.id];
        state[item.id] = v.includes(k) ? v.filter(x=>x!==k) : [...v, k];
        save(); sync(); syncTally();
      });
      sync(); wall.appendChild(t);
    });
    c.appendChild(wall); box.appendChild(c);
  });
  box.appendChild(tally); syncTally();
  return box;
}

function colorItem(item){
  if (!state[item.id] || typeof state[item.id]!=="object" || !Array.isArray(state[item.id].list)) state[item.id]={list:[],note:""};
  const st = state[item.id];
  const q = el("div",{class:"q",role:"group","aria-label":item.label});
  q.appendChild(el("span",{class:"ql"}, item.label));
  q.appendChild(el("span",{class:"hint"}, item.hint));
  const msg = el("div",{class:"limit","aria-live":"polite"});
  const grid = el("div",{class:"swatches"});
  const btns = [];
  const syncAll = () => {
    btns.forEach(b => {
      const i = st.list.findIndex(h=>h.toLowerCase()===b.dataset.h.toLowerCase());
      b.setAttribute("aria-pressed", i>=0);
      b.querySelector(".ord").textContent = i===0 ? "메인" : i===1 ? "보조" : "";
    });
    none.setAttribute("aria-pressed", !!st.none);
    previews.forEach(fn=>fn());
  };
  const toggle = (h) => {
    const i = st.list.findIndex(x=>x.toLowerCase()===h.toLowerCase());
    if (i>=0) st.list.splice(i,1);
    else { if (st.list.length>=item.max){ limitMsg(msg, `${item.max}개까지 고를 수 있어요. 하나를 해제하고 다시 골라주세요.`); return; } st.list.push(h); st.none = false; }
    save(); syncAll();
  };
  COLORS.forEach(c => {
    const b = el("button",{type:"button",class:"sw","data-h":c.h},
      `<i style="background:${c.h}"></i><span class="ord"></span><b>${c.n}</b><small>${c.h}</small>`);
    b.addEventListener("click", () => toggle(c.h));
    btns.push(b); grid.appendChild(b);
  });
  q.appendChild(grid);
  const none = el("button",{type:"button",class:"chip",id:"point-none"}); none.textContent = "포인트 컬러 없이 흑백으로 충분해요";
  none.addEventListener("click", () => { st.none = !st.none; if (st.none) st.list = []; save(); syncAll(); });
  const noneRow = el("div",{class:"chips"}); noneRow.appendChild(none); q.appendChild(noneRow);

  const custom = el("div",{class:"custom"});
  const picker = el("input",{type:"color",id:"point-picker","aria-label":"직접 색 고르기",value:"#3a6ea5"});
  const hex = el("input",{type:"text",id:"point-hex","aria-label":"색상 코드",value:"#3A6EA5",maxlength:"7"});
  const add = el("button",{type:"button",class:"chip"}); add.textContent="이 색 추가";
  picker.addEventListener("input", () => { hex.value = picker.value.toUpperCase(); });
  hex.addEventListener("input", () => { if (HEX.test(hex.value)) picker.value = hex.value.toLowerCase(); });
  add.addEventListener("click", () => {
    const h = (HEX.test(hex.value) ? hex.value : picker.value).toUpperCase();
    if (st.list.some(x=>x.toLowerCase()===h.toLowerCase())) return;
    toggle(h);
  });
  custom.appendChild(el("span",{class:"small"},"원하는 색이 없다면"));
  custom.append(picker, hex, add);
  q.appendChild(custom);
  q.appendChild(msg);

  const pv = el("div",{class:"preview","aria-label":"선택한 색 미리보기"});
  const mk = (cls) => { const p = el("div",{class:"pv "+cls}); p.innerHTML = `<span class="nm"></span><span class="rule"></span>`; pv.appendChild(p); return p; };
  const dark = mk("dark"), light = mk("light");
  previews.push(() => {
    const name = (state.name_en || state.name_ko || "Brand").trim();
    const [a,b] = st.list;
    [[dark,"#f2f0ea"],[light,"#161616"]].forEach(([p,base]) => {
      p.querySelector(".nm").textContent = name.toUpperCase();
      p.querySelector(".nm").style.color = a || base;
      p.querySelector(".rule").style.background = b || a || base;
    });
    // extra pills beside the swatches for picked custom colors
    q.querySelectorAll(".chip.picked").forEach(n=>n.remove());
    st.list.filter(h=>!COLORS.some(c=>c.h.toLowerCase()===h.toLowerCase())).forEach(h => {
      const c = el("button",{type:"button",class:"chip picked","aria-pressed":"true"},
        `<span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${h};vertical-align:-1px;margin-right:6px"></span>${h} 해제`);
      c.addEventListener("click", () => toggle(h));
      custom.appendChild(c);
    });
  });
  q.appendChild(pv);
  q.appendChild(el("span",{class:"hint",style:"margin-top:8px"},"위 미리보기는 색 조합만 보여드리는 거예요. 실제 로고 모양과는 달라요."));

  const note = el("input",{type:"text",class:"note",id:"point-note","aria-label":"포인트 컬러 메모"});
  note.placeholder="색에 대한 메모가 있다면 (선택) 예: 너무 쨍하지 않은 빨강"; note.value = st.note || "";
  note.addEventListener("input", () => { st.note = note.value; save(); });
  q.appendChild(note);
  syncAll();
  return q;
}

const form = document.getElementById("form");
SECTIONS.forEach((sec, si) => {
  const s = el("section",{class:"sec"});
  s.appendChild(el("h2",{},`<span class="n">${String(si+1).padStart(2,"0")}</span>${sec.title}`));
  if (sec.intro) s.appendChild(el("p",{class:"intro"}, sec.intro));
  sec.items.forEach(item => {
    if (item.type==="text" || item.type==="textarea"){
      const q = el("label",{class:"q"});
      q.appendChild(el("span",{class:"ql"}, item.label));
      if (item.hint) q.appendChild(el("span",{class:"hint"}, item.hint));
      const f = item.type==="text" ? el("input",{type:"text",id:"f-"+item.id}) : el("textarea",{id:"f-"+item.id});
      if (item.ph) f.placeholder=item.ph;
      f.value = state[item.id] || "";
      f.addEventListener("input", () => { state[item.id]=f.value; save(); if (item.id.startsWith("name_")) previews.forEach(fn=>fn()); });
      q.appendChild(f); s.appendChild(q);
    } else if (item.type==="multi" || item.type==="single"){
      const q = el("div",{class:"q",role:"group","aria-label":item.label});
      q.appendChild(el("span",{class:"ql"}, item.label));
      if (item.hint) q.appendChild(el("span",{class:"hint"}, item.hint));
      const msg = el("div",{class:"limit","aria-live":"polite"});
      q.appendChild(chipGroup(item, item.options, item.type==="multi", () => limitMsg(msg, `${item.max}개까지 고를 수 있어요. 하나를 해제하고 다시 골라주세요.`)));
      if (item.max) q.appendChild(msg);
      s.appendChild(q);
    } else if (item.type==="gallery"){
      s.appendChild(galleryItem(item));
    } else if (item.type==="colors"){
      s.appendChild(colorItem(item));
    } else if (item.type==="pick"){
      if (!state[item.id] || typeof state[item.id]!=="object") state[item.id]={choice:"",note:""};
      const st = state[item.id];
      const q = el("div",{class:"q",role:"group","aria-label":item.label});
      q.appendChild(el("span",{class:"ql"}, item.label));
      if (item.hint) q.appendChild(el("span",{class:"hint"}, item.hint));
      const grid = el("div",{class:"picks"+(item.options.length===3?" three":"")});
      const all = [];
      const syncAll = () => all.forEach(b => b.setAttribute("aria-pressed", st.choice===b.dataset.k));
      item.options.forEach(o => {
        const b = el("button",{type:"button",class:"pick","data-k":o.k,"aria-label":`${o.k}. 예: ${o.l.map(k=>LOGOS[k]).join(", ")}`},
          `${reel(o.l)}<span class="cap">${o.k}${o.d?`<small>${o.d}</small>`:""}</span>`);
        b.addEventListener("click", () => { st.choice = st.choice===o.k ? "" : o.k; save(); syncAll(); });
        all.push(b); grid.appendChild(b);
      });
      q.appendChild(grid);
      const extra = el("div",{class:"chips"});
      [item.options.length>2 ? "다 좋아요" : "둘 다 좋아요","잘 모르겠어요"].forEach(t => {
        const b = el("button",{type:"button",class:"chip","data-k":t}); b.textContent=t;
        b.addEventListener("click", () => { st.choice = st.choice===t ? "" : t; save(); syncAll(); });
        all.push(b); extra.appendChild(b);
      });
      q.appendChild(extra);
      const note = el("input",{type:"text",class:"note",id:"note-"+item.id,"aria-label":item.label+" 이유"});
      note.placeholder="이유가 있다면 한 줄로 (선택)"; note.value=st.note||"";
      note.addEventListener("input", () => { st.note=note.value; save(); });
      q.appendChild(note);
      syncAll(); s.appendChild(q);
    }
  });
  form.appendChild(s);
});

function summary(){
  const lines = ["[로고 디자인 사전 설문 답변]",""];
  SECTIONS.forEach((sec, si) => {
    lines.push(`■ ${si+1}. ${sec.title}`);
    sec.items.forEach(item => {
      let v = state[item.id];
      if (item.type==="pick") v = v && v.choice ? v.choice + (v.note ? ` (이유: ${v.note})` : "") : "";
      else if (item.type==="gallery") v = (v||[]).filter(k=>LOGOS[k]).map(k=>LOGOS[k]).join(", ");
      else if (item.type==="colors") v = v && v.none ? "흑백으로 충분해요" + (v.note ? ` (메모: ${v.note})` : "")
        : v && v.list && v.list.length
        ? v.list.map((h,i)=>`${i===0?"메인":"보조"} ${colorName(h)} ${h.toUpperCase()}`).join(" / ") + (v.note ? ` (메모: ${v.note})` : "")
        : (v && v.note ? `(메모: ${v.note})` : "");
      else if (Array.isArray(v)) v = v.join(", ");
      lines.push(`- ${item.label}: ${(v||"").toString().trim() || "(미작성)"}`);
    });
    lines.push("");
  });
  return lines.join("\n");
}

document.getElementById("copy").addEventListener("click", async () => {
  const out = document.getElementById("out"), status = document.getElementById("status");
  const text = summary();
  out.value = text; out.hidden = false;
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch(e) {
    try { out.focus(); out.select(); ok = document.execCommand("copy"); } catch(e2) { ok = false; }
  }
  status.textContent = ok
    ? "복사됐어요. 카카오톡이나 메일에 붙여넣어 보내주세요."
    : "자동 복사가 안 됐어요. 아래 내용을 길게 눌러 전체 선택 후 복사해 주세요.";
});
</script>
